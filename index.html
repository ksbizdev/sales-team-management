.login-bg{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#f8fafc)}.login-card{width:min(440px,94vw);padding:34px!important}.login-card h1{margin:8px 0}.login-card label{display:block;margin-top:15px}.login-icon{font-size:36px;color:#6366f1}.dark .login-bg{background:linear-gradient(135deg,#101c42,#0a1027)}.dark .login-card{background:#182443}.modal{max-height:90vh;overflow:auto}.permcheck{accent-color:#6366f1} .sidefoot{display:none}
/* Visible Excel-like table borders on every module */
.tablewrap table{border-collapse:collapse;border:1px solid #d9e0ec}
.tablewrap th,.tablewrap td{border:1px solid #d9e0ec!important}
.tablewrap th{background:#eef2fa}
/* Horizontal organization chart: manager at root, leaders in same row, reports under their leader */
.hier{overflow-x:auto;padding:28px 12px 25px;text-align:center}
.org-root{display:flex;flex-direction:column;align-items:center;min-width:max-content}
.org-node-holder{display:flex;justify-content:center}
.org-root>.org-children{display:flex;align-items:flex-start;justify-content:center;gap:18px;margin-top:23px;padding-top:20px;position:relative}
.org-root>.org-children:before{content:'';position:absolute;top:0;left:50%;height:20px;border-left:2px solid #c8d2e8}
.org-branch{position:relative;flex:0 0 auto;min-width:188px}
.org-branch:before{content:'';position:absolute;top:-20px;left:50%;height:20px;border-left:2px solid #c8d2e8}
.org-branch>.org-root>.org-node-holder>.node{margin:0;max-width:210px;white-space:normal}
.org-root>.org-node-holder>.node{margin:0;max-width:250px;white-space:normal}
.org-branch .org-branch{min-width:155px}
.org-branch .org-branch .node{min-width:145px}
/* Starlight contrast fixes for all controls, tables, alerts and popup */
.dark{color:#f5f8ff}
.dark .main,.dark .card,.dark .modal,.dark .overlay{color:#f3f7ff}
.dark .muted,.dark .formgrid label,.dark label,.dark .empty,.dark .tablefoot,.dark .brand small,.dark .stat small{color:#bdcbe5}
.dark .tablewrap table{border-color:#405778}
.dark .tablewrap th,.dark .tablewrap td{color:#eff5ff!important;border:1px solid #405778!important}
.dark .tablewrap th{background:#26395b!important;color:#e8f0ff!important}
.dark input,.dark select,.dark textarea{color:#f7faff!important;background:#1d3153!important;border-color:#486083!important}
.dark input::placeholder{color:#c3d0e8}
.dark select option{background:#1d3153;color:#f7faff}
.dark .field,.dark .notice,.dark .pill,.dark .pill.off,.dark .node,.dark .node.inactive{color:#edf4ff}
.dark .pill{background:#174c45;color:#bdf5de}.dark .pill.off{background:#45506b;color:#eff3ff}
.dark .pill.role{background:#384d89;color:#edf1ff}
.dark .btn.secondary,.dark .btn.ghost,.dark .nav,.dark .nav.active{color:#fff}
.dark .org-branch:before,.dark .org-root>.org-children:before{border-color:#61789e}
@media(max-width:680px){.org-root>.org-children{gap:8px}.org-branch{min-width:155px}}

/* Excel-style filters and hierarchy role bands */
.headerwrap{display:flex;align-items:center;gap:3px}.header-sort,.filter-icon{border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700;padding:3px 5px;white-space:nowrap}.header-sort:hover,.filter-icon:hover,.filter-icon.active{color:#6669e6;background:#e8edff;border-radius:5px}.tablewrap th{position:relative;overflow:visible}.excel-popup{position:absolute;top:100%;left:0;z-index:15;width:245px;max-height:270px;overflow:auto;background:var(--panel,#fff);border:1px solid #cbd3e6;border-radius:12px;padding:12px;box-shadow:0 14px 36px #13244333;color:#27334b;font-weight:400}.excel-popup .excel-search{width:100%;margin:8px 0}.filter-option{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:12px;font-weight:400;white-space:normal;cursor:pointer}.filter-option input{width:auto;flex-shrink:0}.error-notice{background:#fff0f0!important;color:#a9293c!important;font-weight:600}.org-member-row{width:100%;margin-top:18px!important}.dark .excel-popup{color:#f2f6ff;background:#1d3153;border-color:#536589}.dark .header-sort:hover,.dark .filter-icon:hover,.dark .filter-icon.active{background:#425681;color:#fff}.dark .error-notice{background:#522538!important;color:#ffe4e8!important}

/* Compact Excel filter: no title; search reacts immediately; all actions have visible checkbox feedback. */
.excel-popup{position:fixed!important;z-index:10020!important;width:260px;max-height:min(330px,65vh);overflow:auto;padding:10px;left:var(--popup-left,20px);top:var(--popup-top,120px)}
.excel-popup .excel-search{margin:0 0 8px;width:100%}
.excel-popup .filter-option{margin:0;padding:7px 5px}
.excel-popup .select-all{font-weight:700;border-bottom:1px solid #dce3f1;margin-bottom:5px}
.dark .excel-popup .select-all{border-bottom-color:#536589}
/* Each role tier occupies one HORIZONTAL row; advisors line up beneath own leader. */
.org-chart{display:flex;align-items:center;flex-direction:column;width:max-content;min-width:100%;}
.org-chart .org-level-line{height:25px;border-left:2px solid #c8d2e8}
.org-leader-level{display:flex;flex-direction:row;align-items:flex-start;justify-content:center;flex-wrap:nowrap;gap:22px;max-width:none;width:max-content;}
.org-leader-column{display:flex;flex-direction:column;align-items:center;min-width:175px;gap:12px;position:relative}
.org-leader-column>.node{min-width:168px;max-width:220px;margin:0;}
.org-leader-column .org-reporting{font-size:11px;color:var(--muted);text-align:center;margin-top:-6px}
.org-advisors{display:flex;flex-direction:row;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:nowrap}
.org-advisors .node{min-width:145px;max-width:190px;margin:0;white-space:normal}
.org-direct{margin-top:24px;display:flex;align-items:center;flex-direction:column;gap:12px}
.org-direct-label{font-size:12px;color:var(--muted)}
.dark .org-chart .org-level-line{border-color:#61789e}
.dark .org-reporting,.dark .org-direct-label{color:#c6d6f0}

/* Branch-specific Team Management tabs shared by list and hierarchy */
.branch-tabs{display:flex;gap:7px;overflow-x:auto;align-items:center;border-bottom:1px solid #dbe2f0;margin:-1px 0 18px;padding:0 0 11px}
.branch-tab{white-space:nowrap;background:#f6f8ff;color:#50607d;border:1px solid #e0e6f2;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px}
.branch-tab span{display:inline-block;margin-left:6px;font-size:10px;background:#e8ecf7;border-radius:15px;padding:3px 6px}
.branch-tab.active{background:#6576e2;border-color:#6576e2;color:#fff}
.branch-tab.active span{background:#ffffff36;color:#fff}
.pill.role-manager{background:#e9edff;color:#4d5aca}
.pill.role-leader{background:#e0f5f2;color:#177e79}
.pill.role-member{background:#fff0de;color:#a26613}
.dark .pill.role-manager{background:#354b94;color:#f6f7ff}
.dark .pill.role-leader{background:#185e62;color:#e0fffb}
.dark .pill.role-member{background:#765121;color:#fff3db}
.dark .branch-tab{background:#213455;color:#e2eafc;border-color:#3c5176}
.dark .branch-tab.active{background:#6679ed;color:white}
.dark .branch-tab span{background:#415474;color:#fff}
/* Tree connectors: isolated independent chart per manager; connector at every parent and child */
.new-hier{display:flex;flex-direction:column;align-items:stretch;gap:28px;overflow:visible;padding:8px 0 14px;text-align:center}
.hier-team{border:1px solid #e0e6f1;border-radius:15px;padding:20px 12px 16px;background:#fcfdff;min-width:0;overflow:hidden}
.hier-team-label{text-align:left;font-weight:700;font-size:13px;color:#65728e;padding:0 9px 16px}
.chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden;padding:0 8px 12px}
.org-tree{display:table;margin:0 auto;min-width:max-content;padding:0 12px}
.org-tree ul{position:relative;display:flex;justify-content:center;align-items:flex-start;padding:25px 0 0;margin:0;list-style:none}
.org-tree>ul{padding-top:0}
.org-tree li{position:relative;list-style:none;text-align:center;padding:25px 7px 0;display:flex;flex-direction:column;align-items:center;flex:none}
.org-tree>ul>li{padding-top:0}
.org-tree li:before,.org-tree li:after{content:'';position:absolute;top:0;right:50%;border-top:2px solid #c5d1e8;width:50%;height:25px}
.org-tree li:after{right:auto;left:50%;border-left:2px solid #c5d1e8}
.org-tree li:only-child:after,.org-tree li:only-child:before{display:none}
.org-tree li:only-child{padding-top:0}
.org-tree li:first-child:before,.org-tree li:last-child:after{border:0 none}
.org-tree li:last-child:before{border-right:2px solid #c5d1e8;border-radius:0 6px 0 0}
.org-tree li:first-child:after{border-radius:6px 0 0 0}
.org-tree ul ul:before{content:'';position:absolute;top:0;left:50%;height:25px;border-left:2px solid #c5d1e8}
.org-tree .hier-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:162px;max-width:190px;padding:13px 12px;border-radius:12px;border:1px solid #d5def0;cursor:pointer;white-space:normal;color:#25314c;background:#f4f7ff;box-shadow:0 2px 8px #25314c08}
.org-tree .hier-card b{font-size:13px}.org-tree .hier-card small{font-size:11px;color:#56647c}
.org-tree .hier-card.manager{background:#e9edff;border-color:#dbe1ff}
.org-tree .hier-card.leader{background:#e4f7f3;border-color:#cde8e2}
.org-tree .hier-card.member{background:#fff4e5;border-color:#f3e4cc}
.org-tree .hier-card.inactive{background:#eceef3;color:#757c8d}
.dark .hier-team{background:#182747;border-color:#3a4b6a}
.dark .hier-team-label{color:#d6e2fb}
.dark .org-tree li:before,.dark .org-tree li:after,.dark .org-tree ul ul:before{border-color:#7790c0}
.dark .org-tree .hier-card{color:#f3f7ff;border-color:#58709a}
.dark .org-tree .hier-card.manager{background:#334679}
.dark .org-tree .hier-card.leader{background:#17585a}
.dark .org-tree .hier-card.member{background:#654823}
.dark .org-tree .hier-card.inactive{background:#35405b;color:#d6dfec}
.dark .org-tree .hier-card small{color:#dae6fa}

/* v7: grouped roster, visually separated by direct manager / team leader */
.team-group-divider td{padding:10px 13px 9px!important;border-top:4px solid #7789cf!important;border-bottom:1px solid #cad4ef!important;background:#eef2fc!important;cursor:default!important}
.team-group-divider:first-child td{border-top-width:3px!important}
.group-label{font-size:12px;font-weight:800;letter-spacing:.01em;color:#3c4d83}
.group-arrow{padding:0 8px;color:#8392c5}
.dark .team-group-divider td{background:#283d66!important;border-top-color:#8295ec!important;border-bottom-color:#50638f!important}
.dark .group-label{color:#eef3ff}
.dark .group-arrow{color:#aabcf7}

/* v8 refinements */
.branch-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.branch-card{padding:0;overflow:hidden;cursor:default}.branch-cover{height:160px;display:flex;align-items:center;justify-content:center;background:linear-gradient(125deg,#233e79,#7897e6);color:#f7f9ff;position:relative;overflow:hidden}.branch-cover img{width:100%;height:100%;object-fit:cover}.branch-cover .fallback{font-size:52px;opacity:.75}.branch-info{padding:19px}.branch-info strong{font-size:19px}.branch-info small{color:#8793a9}.branch-count{font-size:25px;font-weight:800;color:#6574dd;margin:10px 0}.branch-managers{border-top:1px solid var(--line,#e3e8f1);padding-top:12px;margin-top:10px;font-size:13px}.dark .branch-count{color:#b4b5ff}.dark .branch-info small{color:#abb8d5}
.data-filter{position:fixed;z-index:13000;width:260px;max-height:360px;overflow:auto;background:var(--panel,#fff);border:1px solid #bfc9e0;box-shadow:0 20px 48px #101b3350;border-radius:12px;padding:12px;color:inherit}.data-filter input[type=checkbox]{width:auto}.data-filter .filter-option{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px}.data-filter .filter-search{width:100%}.data-sort{border:none;background:transparent;font-weight:700;color:inherit;cursor:pointer}.data-filter-icon{border:0;background:transparent;color:#6474b1;cursor:pointer;padding:6px}.data-filter-icon.active{color:#c04f9f}
.admin-row{cursor:pointer}.wide-modal{width:min(930px,calc(100vw - 36px))!important}.wide-modal .tablewrap{overflow-x:auto}.wide-modal .perm-grid{width:100%}.branch-preview{width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid #dde3f1;margin:10px 0}.inact-transfer{margin:12px 0;padding:12px;border:1px solid #dce4f4;border-radius:12px}.inact-transfer select{width:100%;max-width:none}.inact-transfer .member-name{display:block;font-weight:700;margin-bottom:6px}.dark .data-filter{background:#203153;border-color:#46577a;color:white}.dark .data-filter-icon{color:#d5d9ff}.dark .inact-transfer{border-color:#40547c}.dark .branch-cover{background:linear-gradient(120deg,#173264,#4452a8)}

/* v9: polished dashboard motion, inspired by gradient glass blob card */
.stat{position:relative;overflow:hidden;isolation:isolate;transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s ease,border-color .32s ease;min-height:154px}
.stat::before{content:"";position:absolute;width:155px;height:155px;border-radius:50%;right:-60px;top:-65px;background:var(--stat-gradient,linear-gradient(125deg,#7367ef,#afabff));filter:blur(24px);opacity:.16;z-index:-1;transition:opacity .3s,transform .45s}
.stat:hover{transform:translateY(-8px);box-shadow:0 22px 42px rgba(70,78,162,.17);border-color:#bec8fa}
.stat:hover::before{transform:scale(1.35) translate(-12px,10px);opacity:.35}
.stat:nth-child(2){--stat-gradient:linear-gradient(135deg,#5675ef,#9bb4ff);--stat-accent:#536be5}
.stat:nth-child(1){--stat-gradient:linear-gradient(135deg,#8e5ef5,#c3a7ff);--stat-accent:#9363ea}
.stat:nth-child(3){--stat-gradient:linear-gradient(135deg,#0db5ae,#9fe8db);--stat-accent:#119b94}
.stat:nth-child(4){--stat-gradient:linear-gradient(135deg,#f39a47,#ffd79a);--stat-accent:#e18b3d}
.stat .stat-icon{display:inline-flex;align-items:center;justify-content:center;width:37px;height:37px;border-radius:12px;background:color-mix(in srgb,var(--stat-accent) 13%,transparent);color:var(--stat-accent);font-size:19px;margin-bottom:10px;transition:transform .35s}
.stat:hover .stat-icon{transform:rotate(-7deg) scale(1.12)}
.stat .stat-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat .stat-heading small{font-weight:650;color:var(--stat-accent)}
.stat b{margin:4px 0 5px}
.branch-card{position:relative;isolation:isolate;transition:transform .38s cubic-bezier(.18,.8,.2,1),box-shadow .4s,border-color .35s;will-change:transform}
.branch-card:hover{transform:translateY(-9px);border-color:#b6baf7;box-shadow:0 24px 48px rgba(57,65,124,.18)}
.branch-cover{isolation:isolate;transition:background .4s}
.branch-cover img{position:relative;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .55s}
.branch-cover .fallback{position:relative;z-index:1}
.branch-cover::before{content:"";position:absolute;z-index:0;width:170px;height:170px;left:24%;top:0;border-radius:50%;background:linear-gradient(110deg,#ec4899,#ef4444,#facc15);filter:blur(14px);opacity:.65;transform:translate(-75%,-55%);animation:branch-blob-drift 5s linear infinite;animation-play-state:paused}
.branch-card:hover .branch-cover::before{animation-play-state:running;opacity:1}
.branch-card:hover .branch-cover img{transform:scale(1.085);filter:saturate(1.1)}
.branch-cover::after{content:"";position:absolute;z-index:2;inset:5px;border-radius:12px;border:1px solid rgba(255,255,255,.45);background:linear-gradient(120deg,rgba(255,255,255,.03),rgba(255,255,255,.18),rgba(255,255,255,.02));backdrop-filter:blur(0px);pointer-events:none;transition:backdrop-filter .4s,border-color .3s}

.moto-field-shell{display:flex;align-items:center;position:relative}
.moto-field-shell .moto-symbol{position:absolute;left:16px;z-index:1;color:#8297bd;font-size:18px;line-height:1;pointer-events:none}
.moto-field-shell input{border-radius:13px!important;width:100%;height:56px;padding:14px 46px!important;border:1px solid #dbe6f5!important;background:#ffffffc7!important;color:#183157!important;font-size:15px!important;box-shadow:0 2px 3px #27417706;transition:box-shadow .22s,transform .22s,border-color .22s}
.moto-field-shell input:focus{border-color:#6d81f3!important;outline:0;box-shadow:0 0 0 4px #757af21b,0 8px 18px #597bca16;transform:translateY(-1px)}
.moto-field-shell input::placeholder{color:#9aabc5}
.moto-toggle{position:absolute;right:9px;border:0;background:transparent;color:#637ba7;font-size:12px;font-weight:750;padding:10px 9px;border-radius:8px;cursor:pointer;z-index:2}
.moto-toggle:hover{background:#e9efff}
.moto-signin{margin-top:9px;width:100%;height:56px;border:0;border-radius:13px;background:linear-gradient(104deg,#1880f5,#4264f9 52%,#7441ef);color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 13px 25px #526cf251;transition:transform .2s,box-shadow .2s,background-position .4s;background-size:170% 100%}
.moto-signin:hover{transform:translateY(-3px);box-shadow:0 18px 34px #526cf26c;background-position:100% 0}
.moto-signin:active{transform:translateY(0)}
.moto-error{min-height:18px;margin:12px 0 0;color:#cb3851;font-size:12px;line-height:1.5}
.moto-demo{margin-top:24px;padding:11px 13px;border:1px solid #d5e0f7;background:#eef4ffb0;border-radius:10px;color:#5c7198;font-size:12px;line-height:1.5}
.moto-demo strong{color:#2a4775}
@keyframes moto-breathe{from{transform:scale(1.01) translateY(0)}to{transform:scale(1.055) translateY(-8px)}}
@keyframes moto-twinkle{0%{opacity:.12;transform:scale(.65)}100%{opacity:.8;transform:scale(1.8)}}
@keyframes moto-float{to{transform:translate(-35px,30px) scale(1.12)}}
@keyframes moto-enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:950px){.moto-login-shell{grid-template-columns:1fr;max-width:660px}.moto-hero{min-height:360px}.moto-hero-photo{background-position:center 37%}.moto-form-side{padding:25px 18px 32px}.moto-form-panel{max-width:520px}.moto-login{padding:12px}}
@media(max-width:600px){.moto-login-shell{border-radius:18px}.moto-hero{min-height:270px}.moto-hero-photo{background-position:center 27%}.moto-form-panel{padding:23px}.moto-form-panel h1{font-size:34px;margin-bottom:23px}.moto-form-side{padding:14px 13px 24px}}
@media(prefers-reduced-motion:reduce){.moto-login *{animation:none!important;transition:none!important}}

/* v37 — visibly traveling neon segments; stationary base, moving light only */
.moto-flow-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
.moto-track-base{fill:none;stroke:url(#moto-track-gradient);stroke-width:2;opacity:.35}



/* v39: static motorcycle image; one slow moving violet/blue highlight only on hovered login card */
.moto-hero-photo{animation:none!important;transform:none!important;transition:none!important}
@property --login-edge-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.moto-form-panel{position:relative;isolation:isolate;overflow:visible}
.moto-form-panel::before{content:"";position:absolute;inset:-2px;border-radius:27px;padding:2.5px;pointer-events:none;opacity:0;background:conic-gradient(from var(--login-edge-angle),transparent 0deg,transparent 270deg,rgba(45,113,255,.14) 291deg,#308dff 309deg,#7760ff 329deg,#b483ff 342deg,transparent 359deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;transition:opacity .35s ease}
.moto-form-panel:hover::before,.moto-form-panel:focus-within::before{opacity:1;animation:moto-edge-travel 8s linear infinite}
.moto-form-panel:hover,.moto-form-panel:focus-within{box-shadow:0 25px 65px #315b9840,inset 0 1px 1px #fff}
@keyframes moto-edge-travel{to{--login-edge-angle:360deg}}
@media(prefers-reduced-motion:reduce){.moto-form-panel:hover::before,.moto-form-panel:focus-within::before{animation:none!important}}

.moto-setup-note{font-size:13px;line-height:1.65;color:#71809c;margin:0 0 20px}.moto-field-shell input[readonly]{background:#edf2fa!important;color:#60708b!important}.moto-signin:disabled{opacity:.55;cursor:wait}

/* v43: desktop / tablet / phone responsive polish; preserve complete motorcycle photo */
html,body{max-width:100%;min-width:0;overflow-x:clip}
#root,.app,.main{min-width:0;max-width:100%}
.main{width:100%;overflow-wrap:anywhere}
.top,.toolbar,.filters,.actions,.tablefoot{min-width:0}
.top>*{min-width:0}
.toolbar .btn,.actions .btn,.filters .btn{max-width:100%;white-space:normal;text-align:center}
.card{min-width:0}
.tablewrap{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}
.tablewrap table{width:100%}
.overlay{max-width:100vw;overflow-y:auto;overscroll-behavior:contain;align-items:safe center}
.modal{max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden}
.modal input,.modal select,.modal textarea{max-width:100%;min-width:0}
.formgrid>*,.permission-matrix,.permission-matrix-wrap,.role-permission-matrix{min-width:0;max-width:100%}
.notif{right:clamp(8px,2vw,30px);max-width:calc(100vw - 16px)}
.moto-hero{background:#081633}
.moto-hero-photo{background-size:contain!important;background-repeat:no-repeat!important;background-position:center center!important;animation:none!important;transform:none!important}
.moto-login-shell,.moto-form-side,.moto-form-panel{min-width:0}
@media(max-width:1100px) and (min-width:951px){
 .moto-login-shell{grid-template-columns:minmax(0,1.05fr) minmax(350px,.9fr)}
 .moto-form-side{padding:24px}.moto-form-panel{padding:26px}
 .main{padding:20px 22px}
}
@media(max-width:950px){
 .moto-login-shell{grid-template-columns:minmax(0,1fr);height:auto;min-height:0;max-width:700px}
 .moto-hero{min-height:0!important;height:auto;aspect-ratio:892/796}
 .moto-hero-photo{background-position:center!important}
 .moto-form-side{padding:22px 18px 28px}
 .moto-form-panel{width:min(440px,100%)}
 .main{padding:18px}
}
@media(max-width:700px){
 .app{display:block;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
 .side{position:fixed!important;top:auto!important;bottom:0;left:0;right:0;z-index:20;width:100%!important;height:auto!important;min-height:68px;padding:6px 5px calc(6px + env(safe-area-inset-bottom))!important;display:flex;flex-direction:row;align-items:stretch;justify-content:space-around;gap:2px;background:var(--panel,#fff);border:0;border-top:1px solid #e2e8f7;box-shadow:0 -6px 24px #15244416}
 .side .brand,.side .sidefoot{display:none!important}
 .side .nav{flex:1;min-width:0;padding:8px 2px 6px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0!important;line-height:1.25;overflow:hidden;white-space:nowrap}
 .side .nav::before{display:block;font-size:20px;line-height:1.2;content:'◈'}
 .side .nav[data-nav="Dashboard"]::before{content:'▦'}
 .side .nav[data-nav="Team Management"]::before{content:'♧'}
 .side .nav[data-nav="Ultranet"]::before{content:'▤'}
 .side .nav[data-nav="Activity History"]::before{content:'◷'}
 .side .nav[data-nav="Administration"]::before{content:'⚙'}
 .side .nav::after{content:attr(data-nav);font-size:clamp(8px,1.9vw,10px);font-weight:650;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4}
 .main{width:100%;max-width:100%;padding:14px 12px 22px!important}
 .top{gap:12px;flex-wrap:wrap}
 .top h1{font-size:clamp(20px,5vw,26px)}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .stat b{font-size:clamp(23px,6vw,32px)}
 .tablefoot{flex-wrap:wrap;justify-content:center}
 .formgrid{grid-template-columns:minmax(0,1fr)}
 .modal{padding:20px 15px;border-radius:17px}
 .filters{gap:7px}
 .filters input{max-width:100%}
 .moto-login{padding:10px!important;min-height:100dvh}
 .moto-login-shell{width:100%;max-width:600px;border-radius:18px}
 .moto-hero{aspect-ratio:892/796;min-height:0!important}
 .moto-form-side{padding:14px 12px 25px}
 .moto-form-panel{padding:23px 20px;width:100%}
 .moto-form-panel h1{font-size:32px;margin-bottom:22px}
}
@media(max-width:360px){
 .side .nav::before{font-size:18px}
 .side .nav::after{font-size:8px}
 .top .toolbar{width:100%;justify-content:flex-start}
 .moto-form-panel{padding:18px 15px}
 .moto-field-shell input{height:50px}
 .moto-signin{height:50px}
 .stat{padding:12px}
}
@media(prefers-reduced-motion:reduce){.moto-hero-photo{animation:none!important}}

/* v45: exact image-aspect hero. No blurred side strips, cropping or stretch. */
.moto-login-shell{
  grid-template-columns:minmax(0,1.03fr) minmax(405px,.97fr);
  min-height:0!important;
  height:auto!important;
  align-items:stretch;
}
.moto-hero{
  min-height:0!important;
  height:auto!important;
  aspect-ratio:892 / 796;
  align-self:stretch;
  background:#081633;
}
.moto-hero::before{content:none!important;display:none!important;}
.moto-hero-photo{
  inset:0!important;
  background-size:100% 100%!important;
  background-repeat:no-repeat!important;
  background-position:center center!important;
  transform:none!important;
  animation:none!important;
  filter:none!important;
}
@media(max-width:950px){
 .moto-login-shell{grid-template-columns:minmax(0,1fr)!important;max-width:700px!important;}
 .moto-hero{width:100%;height:auto!important;aspect-ratio:892 / 796!important;}
}


/* v49 - stable auth bootstrap and editable branch photo zoom */
.branch-zoom-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 17px;padding:11px 12px;border:1px solid #e3e8f3;border-radius:13px;background:#f8faff}
.branch-zoom-toolbar label{font-weight:700;font-size:13px;color:#4c5c7d;min-width:78px}
.branch-zoom-toolbar input[type=range]{flex:1;min-width:110px;max-width:none;padding:0;accent-color:#7770e9}
.branch-zoom-toolbar b{min-width:48px;text-align:right;font-size:13px;color:#45557c}
.branch-zoom-toolbar .btn{min-width:35px;padding:7px 10px}
.dark .branch-zoom-toolbar{background:#172543;border-color:#344664}
.dark .branch-zoom-toolbar label,.dark .branch-zoom-toolbar b{color:#e4eaff}
.branch-cover img{transition:none!important;animation:none!important}
.restoring-panel{min-height:46vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;border:1px solid #e9edf5;border-radius:18px;background:#fff;color:#65738d}
.restoring-panel p{font-size:14px;margin:0}
.restoring-spinner{width:32px;height:32px;border-radius:50%;border:3px solid #e8eaff;border-top-color:#7568f0;animation:spinRestoring .8s linear infinite}
@keyframes spinRestoring{to{transform:rotate(360deg)}}
.restoring-tabs{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.restoring-tabs span{padding:10px 12px;border-radius:11px;color:#7a88a0;background:#f2f4f9;font-size:13px}
.restoring-tabs span.active{background:#edf0ff;color:#5962bb;font-weight:750}
.dark .restoring-panel{background:#172543;border-color:#344664;color:#d9e2f6}
@media(max-width:580px){.branch-zoom-toolbar{gap:7px}.branch-zoom-toolbar label{width:100%}.branch-zoom-toolbar input[type=range]{min-width:80px}}

/* v50: searchable Reporting To picker */
.member-list-toast{position:fixed;right:24px;bottom:24px;z-index:150;background:#24355b;color:white;padding:13px 18px;border-radius:12px;box-shadow:0 12px 30px #0003;font-size:13px;max-width:min(340px,90vw)}
.reporting-picker{position:relative;min-width:0}
.reporting-picker input.reporting-input{width:100%;padding-right:38px}
.reporting-picker .reporting-chevron{position:absolute;right:13px;top:13px;pointer-events:none;color:#7885a0}
.reporting-results{position:absolute;z-index:110;top:calc(100% + 5px);left:0;right:0;max-height:240px;overflow:auto;background:var(--field,#fff);color:inherit;border:1px solid #d9dff0;border-radius:13px;box-shadow:0 17px 40px #17204430;padding:5px}
.reporting-result{display:block;width:100%;padding:11px 12px;text-align:left;border:0;border-radius:8px;background:transparent;color:inherit;font-size:13px}
.reporting-result:hover,.reporting-result:focus{background:#edf0ff;color:#3f50a8}
.reporting-result small{display:block;color:#8590a8;font-size:11px;margin-top:3px}
.reporting-empty{padding:12px;font-size:12px;color:#8590a8}
.reporting-picker[aria-disabled="true"]{opacity:.6}
.dark .reporting-results{background:#1c2845;border-color:#3a4969}.dark .reporting-result:hover{background:#33416d;color:#fff}

/* v51: expanded member editor and Manager-or-Leader reporting */
.member-editor-modal{width:min(800px,calc(100vw - 32px));max-width:800px}
.member-editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.member-editor-grid>div{min-width:0}
.member-editor-grid input,.member-editor-grid select,.member-editor-grid .member-branch-dropdown{width:100%;max-width:none}
.member-editor-grid .member-editor-fullname,.member-editor-grid .member-editor-reporting,.member-editor-grid .member-editor-ic{grid-column:1/-1}
.member-editor-grid .member-editor-reporting .reporting-results{z-index:60}
@media(max-width:580px){.member-editor-modal{width:calc(100vw - 18px);max-width:calc(100vw - 18px)}.member-editor-grid{grid-template-columns:minmax(0,1fr);gap:14px}.member-editor-grid>div{grid-column:1/-1}}


/* v52: member cards form a vertical column; managers/leaders retain horizontal structure. */
.org-tree ul.hier-members-column{display:flex;flex-direction:column;align-items:center;gap:0;padding:25px 0 0;margin:0;position:relative}
.org-tree ul.hier-members-column>li{display:flex;flex-direction:column;align-items:center;position:relative;padding:24px 4px 0;width:100%}
.org-tree ul.hier-members-column>li:first-child{padding-top:0}
.org-tree ul.hier-members-column>li:before,.org-tree ul.hier-members-column>li:after{display:none!important}
.org-tree ul.hier-members-column>li+li:before{display:block!important;content:'';position:absolute;top:0;left:50%;height:24px;width:0;border:0;border-left:2px solid #c5d1e8}
.org-tree ul.hier-members-column>li+li:after{display:none!important}
.org-tree ul.hier-members-column:before{height:25px}
.org-tree ul.hier-members-column .hier-card{width:190px;max-width:190px}
.dark .org-tree ul.hier-members-column>li+li:before{border-left-color:#7790c0}

/* v54: Manager direct reports occupy the first (left) column beside Leaders. */
.org-tree .hier-manager-direct-row{display:flex;position:relative;align-items:flex-start;justify-content:center;gap:12px;padding-top:25px;width:max-content;max-width:none;margin:0 auto}
.org-tree .hier-manager-direct-row:before{content:'';position:absolute;top:0;left:50%;height:25px;border-left:2px solid #c5d1e8}
.org-tree .hier-manager-direct-row>ul{padding-top:0;margin:0;flex:none}
.org-tree .hier-manager-direct-row>ul:before{display:none}

    if(cmp)return cmp;
    // The manager's own row remains at the beginning of each team.
    if(a.role==='Manager'&&b.role!=='Manager')return -1;
    if(b.role==='Manager'&&a.role!=='Manager')return 1;
    // Each leader and their direct reports form a contiguous section.
    if(ga.leaderId!==gb.leaderId){
      if(ga.leaderId===0)return -1;
      if(gb.leaderId===0)return 1;
      return ga.leaderName.localeCompare(gb.leaderName,undefined,{sensitivity:'base'});

function renderBranchHierarchy(){

}

let ultranetRecords=[];let ultranetBranch='All', ultranetTerm='', ultranetStatus='Active', ultranetRole='All', ultranetFilter={}, ultranetSort={key:'name',direction:1},ultranetEditing=null;

function ultranetData(){

 return scope.filter(p=>memberInBranch(p,ultranetBranch)&&(ultranetStatus==='All'||p.status===ultranetStatus)&&(ultranetRole==='All'||p.role===ultranetRole))
  .map(member=>({member,record:ultranetRecords.find(x=>x.memberId===member.id)}))
  .filter(x=>!ultranetTerm||[x.member.name,memberBranchText(x.member),x.member.role,x.member.status,x.record?.userId||''].join(' ').toLowerCase().includes(ultranetTerm.toLowerCase()))
  .filter(x=>Object.entries(ultranetFilter).every(([k,vals])=>!vals||(k==='branch'?memberBranches(x.member).some(b=>vals.includes(b)):vals.includes(ultranetValue(x,k)))))
  .sort((a,b)=>{
    const ga=memberGroup(a.member),gb=memberGroup(b.member);
    let c=ga.managerName.localeCompare(gb.managerName,undefined,{sensitivity:'base'});
    if(c)return c;
    if(a.member.role==='Manager'&&b.member.role!=='Manager')return -1;
    if(b.member.role==='Manager'&&a.member.role!=='Manager')return 1;
    if(ga.leaderId!==gb.leaderId){if(ga.leaderId===0)return -1;if(gb.leaderId===0)return 1;return ga.leaderName.localeCompare(gb.leaderName,undefined,{sensitivity:'base'});}
    if(a.member.role==='Leader'&&b.member.role!=='Leader')return -1;
    if(b.member.role==='Leader'&&a.member.role!=='Leader')return 1;
    if(ultranetSort.key!=='name'){c=ultranetValue(a,ultranetSort.key).localeCompare(ultranetValue(b,ultranetSort.key),undefined,{numeric:true,sensitivity:'base'})*ultranetSort.direction;if(c)return c;}

  });
}

/* v69: fixed left navigation and one bottom horizontal rail on the content area. */
function setupV69HierarchyRail(){
 const previous=document.getElementById('hierarchyPageRail');
 if(previous)previous.remove();
 if(!(sessionUser&&page==='Team Management'&&view==='Hierarchy'))return;
 const charts=[...document.querySelectorAll('.new-hier .chart-scroll')];
 if(!charts.length)return;
 // Always create the content-side scrollbar. Earlier versions omitted it when
 // clientWidth was measured before the tree had reached its intrinsic width.
 const rail=document.createElement('div');
 rail.className='hierarchy-page-rail';
 rail.id='hierarchyPageRail';
 rail.innerHTML='<div class="rail-scroll" id="hierarchyRailScroller" tabindex="0"><div class="rail-spacer"></div></div><div class="rail-visible-track" id="hierarchyVisibleTrack" role="scrollbar" tabindex="0" aria-label="Scroll hierarchy chart left or right" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0"><div class="rail-visible-thumb"></div></div>';
 document.body.appendChild(rail);
 const scroller=rail.querySelector('.rail-scroll');
 const inner=rail.querySelector('.rail-spacer');
 const track=rail.querySelector('.rail-visible-track');
 const thumb=rail.querySelector('.rail-visible-thumb');
 function paintThumb(){
  const travel=Math.max(1,scroller.scrollWidth-scroller.clientWidth);
  const fraction=Math.max(0,Math.min(1,scroller.scrollLeft/travel));
  const trackWidth=Math.max(1,track.clientWidth);
  const desired=Math.max(48,Math.min(trackWidth,trackWidth*scroller.clientWidth/Math.max(scroller.clientWidth,scroller.scrollWidth)));
  thumb.style.width=desired+'px';thumb.style.transform='translateX('+Math.round(fraction*(trackWidth-desired))+'px)';
  track.setAttribute('aria-valuenow',String(Math.round(fraction*1000)));
 }
 function updateRange(){
  if(!rail.isConnected)return;
  const viewport=Math.max(1,scroller.clientWidth);
  let widest=viewport;
  for(const chart of charts){
   const contentWidth=Math.max(0,...[...chart.querySelectorAll('.org-tree')].map(node=>node.getBoundingClientRect().width));
   widest=Math.max(widest,chart.scrollWidth,contentWidth+32);
  }
  // Keep a visible, usable page-level rail even when the chart fits at this width.
  inner.style.width=Math.ceil(Math.max(widest,viewport+2))+'px';
  inner.style.height='1px';
  paintThumb();
 }
 function syncCharts(){
  const railTravel=Math.max(1,scroller.scrollWidth-scroller.clientWidth);
  const fraction=scroller.scrollLeft/railTravel;
  for(const chart of charts){
   const chartTravel=Math.max(0,chart.scrollWidth-chart.clientWidth);
   chart.scrollLeft=Math.round(fraction*chartTravel);
  }
  paintThumb();
 }
 scroller.addEventListener('scroll',syncCharts,{passive:true});
 let dragStartX=0,dragStartLeft=0;
 track.addEventListener('pointerdown',event=>{
  event.preventDefault();track.setPointerCapture(event.pointerId);
  dragStartX=event.clientX;dragStartLeft=scroller.scrollLeft;
  if(event.target!==thumb){
   const rect=track.getBoundingClientRect();
   const travel=Math.max(1,rect.width-thumb.getBoundingClientRect().width);
   scroller.scrollLeft=Math.max(0,Math.min(1,(event.clientX-rect.left-thumb.getBoundingClientRect().width/2)/travel))*(scroller.scrollWidth-scroller.clientWidth);
   dragStartLeft=scroller.scrollLeft;
  }
 });
 track.addEventListener('pointermove',event=>{
  if(!track.hasPointerCapture(event.pointerId))return;
  const travel=Math.max(1,track.clientWidth-thumb.getBoundingClientRect().width);
  scroller.scrollLeft=dragStartLeft+(event.clientX-dragStartX)/travel*(scroller.scrollWidth-scroller.clientWidth);
 });
 track.addEventListener('keydown',event=>{
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();scroller.scrollLeft+=(event.key==='ArrowLeft'?-1:1)*Math.max(40,scroller.clientWidth*.1)}
  if(event.key==='Home'){event.preventDefault();scroller.scrollLeft=0}
  if(event.key==='End'){event.preventDefault();scroller.scrollLeft=scroller.scrollWidth}
 });

 // Native horizontal gestures over the chart also update the bottom rail.
 for(const chart of charts){
  chart.addEventListener('scroll',()=>{
   if(Math.abs(chart.scrollLeft- Math.round(scroller.scrollLeft/Math.max(1,scroller.scrollWidth-scroller.clientWidth)*Math.max(0,chart.scrollWidth-chart.clientWidth)))<=2)return;
   const travel=Math.max(1,chart.scrollWidth-chart.clientWidth);
   scroller.scrollLeft=Math.round(chart.scrollLeft/travel*Math.max(1,scroller.scrollWidth-scroller.clientWidth));
  },{passive:true});
 }
 updateRange();
 // Re-measure after fonts/images and layout settle, without rebuilding the rail.
 requestAnimationFrame(()=>{updateRange();syncCharts()});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{updateRange();syncCharts()});
}

  const name=String(b||'').trim();

  // A branch reference must occur as a complete token, never as part of a name.
  const pos=text.toLowerCase().indexOf(name.toLowerCase());
  if(pos>=0){const before=text[pos-1]||'',after=text[pos+name.length]||'';
   if(!/[\p{L}\p{N}]/u.test(before)&&!/[\p{L}\p{N}]/u.test(after))matches.add(name);
  }
 }
 const module=notificationPermissionModule(moduleName);
 if(module==='Team Management'||module==='Ultranet'){
  const persons=people.filter(p=>p.name&&text.toLowerCase().includes(String(p.name).toLowerCase()));
  // If multiple named members are affected, conservatively include all branches.
  for(const p of persons)for(const b of memberBranches(p))matches.add(b);
  // For member editors, the selected member can be a reliable fallback only if
  // the logged event actually names the selected member.

 try{

  salesAuthAccessToken=data.session?.access_token;

/* v78: Submit login with Enter from either input; prevent duplicate native submits. */
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter'||e.isComposing||e.repeat)return;
 const target=e.target;
 if(!(target instanceof HTMLInputElement))return;
 if(target.id!=='loginUsername'&&target.id!=='loginPassword')return;
 const form=target.closest('#loginForm');
 if(!form)return;
 e.preventDefault();
 const btn=document.getElementById('loginButton');
 if(btn?.disabled)return;
 if(typeof handleLoginClick==='function')handleLoginClick();
},true);


/* v79 — uppercase account IDs and reliable mobile session/view restoration. */
const v79DirectoryRows=userDirectoryRows;
userDirectoryRows=function(){
  const html=v79DirectoryRows();
  // User ID is always column 2 in User Management. Only change presentation.
  return html.replace(/(<tr\b[^>]*>[\s\S]*?<\/td>\s*<td(?:\s[^>]*)?>)([\s\S]*?)(<\/td>)/g,(_whole,before,cell,after)=>before+cell.replace(/(^|>)([^<>]+)(?=<|$)/g,(_m,prefix,s)=>prefix+s.toUpperCase())+after);
};
const v79ExistingRemember=rememberSalesView;
rememberSalesView=function(){
  v79ExistingRemember();
  try{const data=localStorage.getItem(SALES_VIEW_KEY);if(data)sessionStorage.setItem(SALES_VIEW_KEY,data);}catch(e){}
};
const v79ExistingRestoreView=restoreSalesView;
restoreSalesView=function(){
  try{
    const sessionCopy=sessionStorage.getItem(SALES_VIEW_KEY);
    const localCopy=localStorage.getItem(SALES_VIEW_KEY);
    if(!localCopy&&sessionCopy)localStorage.setItem(SALES_VIEW_KEY,sessionCopy);
  }catch(e){}
  v79ExistingRestoreView();
};
// A temporary network failure must not clear valid locally retained refresh credentials.
restoreSalesSession=async function(){
  let stored=null;
  try{stored=JSON.parse(localStorage.getItem(SALES_SESSION_KEY)||'null')}catch(e){}
  if(!stored?.refresh_token){render();return;}
  salesAuthRefreshToken=stored.refresh_token;
  salesAuthAccessToken=stored.access_token||null;
  salesAuthExpiresAt=Number(stored.expires_at||0);
  showRestoringShell('Restoring your session…');
  try{
    if(!salesAuthAccessToken||Date.now()>salesAuthExpiresAt-90000)await renewSalesSession();
    const info=await salesSessionRequest('me');
    if(info.primary){
      salesRestrictedProfile=null;
      await loadCloudWorkspace();
      sessionUser='admin';role='Admin';actor=0;
      restoreSalesView();
      startCloudPolling();
      saveSalesSession();render();
      if(typeof fetchAccountDirectory==='function')fetchAccountDirectory();
    }else{
      await loadRestrictedSession();
      saveSalesSession();
    }
  }catch(e){
    console.warn('v79 session restore did not complete:',e);
    // Keep the same app shell and stored token for explicit retry; no Login flash.
    showRestoringShell('Could not restore your session. Check your connection and retry.','Retry connection');
  }
};
initializeSalesUI=function(){
  let stored=null;
  try{stored=JSON.parse(localStorage.getItem(SALES_SESSION_KEY)||'null')}catch(e){}
  if(stored?.refresh_token){showRestoringShell('Restoring your session…');restoreSalesSession();}
  else render();
};
const v79OldRestoringShell=showRestoringShell;
showRestoringShell=function(message='Restoring your session…',action=''){
  try{if(!localStorage.getItem(SALES_VIEW_KEY)){
    const val=sessionStorage.getItem(SALES_VIEW_KEY);
    if(val)localStorage.setItem(SALES_VIEW_KEY,val);
  }}catch(e){}
  v79OldRestoringShell(message,action);
};
